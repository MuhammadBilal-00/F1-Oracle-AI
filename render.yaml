# Render Blueprint — deploys the F1 Oracle FastAPI backend.
# The SQLite warehouse, Parquet feature store and trained models are committed,
# so the build is just a dependency install (no heavy model training at build time).
services:
  - type: web
    name: f1-oracle-api
    runtime: python
    plan: free            # upgrade to "starter" if SHAP requests are memory-tight
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # After the Vercel frontend is live, set this to its URL (JSON array).
      - key: CORS_ORIGINS
        value: '["http://localhost:3000"]'
